name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать zip и найти проект
        run: |
          Z=$(find . -iname '*.zip' -not -path './project/*' | head -1)
          if [ -n "$Z" ]; then
            echo "Нашёл архив: $Z"
            mkdir -p project
            unzip -q -o "$Z" -d project
          else
            echo "Архива нет, ищу проект в самом репозитории"
            mkdir -p project
            cp -r . project/ 2>/dev/null || true
          fi
          P=$(find project -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$P" ]; then
            echo "::error::package.json не найден ни в репозитории, ни в zip-архиве"
            ls -R | head -50
            exit 1
          fi
          echo "DIR=$(dirname "$P")" >> "$GITHUB_ENV"
          echo "Проект в папке: $(dirname "$P")"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: npm install
        run: cd "$DIR" && npm install

      - name: Создать Android-проект
        run: cd "$DIR" && npx cap add android

      - name: Иконки
        run: cd "$DIR" && npx capacitor-assets generate --android --iconBackgroundColor '#14121c' --iconBackgroundColorDark '#14121c'

      - name: Портретная ориентация
        run: cd "$DIR" && sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Синхронизация
        run: cd "$DIR" && npx cap sync android

      - name: Сборка APK
        run: cd "$DIR/android" && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pvp-sapper-apk
          path: ${{ env.DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
