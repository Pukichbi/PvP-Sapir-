name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    shell: bash   # bash -eo pipefail: Р»СЋР±Р°СЏ РѕС€РёР±РєР° РІ РєРѕРЅРІРµР№РµСЂРµ РѕСЃС‚Р°РЅР°РІР»РёРІР°РµС‚ С€Р°Рі

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 1. РџСЂРѕРІРµСЂРєР° СЃС‚СЂСѓРєС‚СѓСЂС‹ РїСЂРѕРµРєС‚Р°: СЃСЂР°Р·Сѓ РІРёРґРЅРѕ, РєР°РєРѕРіРѕ С„Р°Р№Р»Р° РЅРµ С…РІР°С‚Р°РµС‚
      - name: "1. РџСЂРѕРІРµСЂРєР° С„Р°Р№Р»РѕРІ РїСЂРѕРµРєС‚Р°"
        run: |
          fail=0
          for f in package.json capacitor.config.json www/index.html assets/icon-only.png assets/icon-foreground.png; do
            if [ -f "$f" ]; then echo "OK   $f"
            else echo "::error title=РќРµС‚ С„Р°Р№Р»Р°::Р¤Р°Р№Р» '$f' РЅРµ РЅР°Р№РґРµРЅ. Р—Р°РіСЂСѓР·РёС‚Рµ Р°СЂС…РёРІ С‚Р°Рє, С‡С‚РѕР±С‹ package.json Р»РµР¶Р°Р» РІ РљРћР РќР• СЂРµРїРѕР·РёС‚РѕСЂРёСЏ, Р° РЅРµ РІ РїРѕРґРїР°РїРєРµ."; fail=1; fi
          done
          echo "--- РЎРѕРґРµСЂР¶РёРјРѕРµ РєРѕСЂРЅСЏ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ ---"; ls -la
          exit $fail

      # 2. РџСЂРѕРІРµСЂРєР° JavaScript РёРіСЂС‹: РѕС€РёР±РєР° РїРѕРєР°Р¶РµС‚ СЃС‚СЂРѕРєСѓ РІРЅСѓС‚СЂРё www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "2. РџСЂРѕРІРµСЂРєР° JavaScript РІ www/index.html"
        run: |
          node -e '
            const fs=require("fs");
            const html=fs.readFileSync("www/index.html","utf8");
            const m=html.match(/<script>([\s\S]*?)<\/script>/);
            if(!m){console.log("::error file=www/index.html::РќРµ РЅР°Р№РґРµРЅ С‚РµРі <script>");process.exit(1)}
            const before=html.slice(0,m.index+"<script>".length).split("\n").length-1;
            fs.writeFileSync("/tmp/game.js",m[1]);
            fs.writeFileSync("/tmp/offset",String(before));
          '
          if ! node --check /tmp/game.js 2> /tmp/js_err.txt; then
            cat /tmp/js_err.txt
            off=$(cat /tmp/offset)
            line=$(grep -m1 -oE 'game\.js:[0-9]+' /tmp/js_err.txt | cut -d: -f2 || true)
            msg=$(grep -m1 -E 'Error' /tmp/js_err.txt || echo "РѕС€РёР±РєР° СЃРёРЅС‚Р°РєСЃРёСЃР°")
            echo "::error file=www/index.html,line=$((line+off)),title=РћС€РёР±РєР° JavaScript::$msg"
            exit 1
          fi
          echo "JavaScript Р±РµР· СЃРёРЅС‚Р°РєСЃРёС‡РµСЃРєРёС… РѕС€РёР±РѕРє"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. РЈСЃС‚Р°РЅРѕРІРєР° Р·Р°РІРёСЃРёРјРѕСЃС‚РµР№
      - name: "3. npm install"
        run: |
          mkdir -p logs
          npm install --no-audit --no-fund --loglevel=info 2>&1 | tee logs/npm.log

      # 4. РЎРѕР·РґР°РЅРёРµ Android-РїСЂРѕРµРєС‚Р°
      - name: "4. РЎРѕР·РґР°РЅРёРµ Android-РїСЂРѕРµРєС‚Р° (cap add android)"
        run: npx cap add android 2>&1 | tee logs/cap-add.log

      # 5. РРєРѕРЅРєРё РёР· assets/
      - name: "5. РРєРѕРЅРєРё РїСЂРёР»РѕР¶РµРЅРёСЏ"
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#14121c' --iconBackgroundColorDark '#14121c' 2>&1 | tee logs/icons.log

      - name: "6. РџРѕСЂС‚СЂРµС‚РЅР°СЏ РѕСЂРёРµРЅС‚Р°С†РёСЏ"
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: "7. РЎРёРЅС…СЂРѕРЅРёР·Р°С†РёСЏ (cap sync)"
        run: npx cap sync android 2>&1 | tee logs/cap-sync.log

      # 8. РЎР±РѕСЂРєР° APK СЃ РїРѕРґСЂРѕР±РЅС‹Рј РІС‹РІРѕРґРѕРј РѕС€РёР±РѕРє Gradle/Java
      - name: "8. РЎР±РѕСЂРєР° APK (Gradle)"
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --warning-mode all --console=plain 2>&1 | tee ../logs/gradle.log

      # Р•СЃР»Рё С‡С‚Рѕ-С‚Рѕ СѓРїР°Р»Рѕ: РѕС€РёР±РєРё РІС‹РІРѕРґСЏС‚СЃСЏ РєСЂР°СЃРЅС‹РјРё РїРѕРјРµС‚РєР°РјРё СЃ С„Р°Р№Р»РѕРј Рё СЃС‚СЂРѕРєРѕР№
      - name: "Р“РґРµ РѕС€РёР±РєР°?"
        if: failure()
        run: |
          echo "## РЎР±РѕСЂРєР° СѓРїР°Р»Р°" >> "$GITHUB_STEP_SUMMARY"
          echo "РЎРјРѕС‚СЂРёС‚Рµ РєСЂР°СЃРЅС‹Рµ РїРѕРјРµС‚РєРё (Annotations) РІРІРµСЂС…Сѓ СЃС‚СЂР°РЅРёС†С‹ Р·Р°РїСѓСЃРєР° Рё РЅРёР¶Рµ вЂ” РєР»СЋС‡РµРІС‹Рµ СЃС‚СЂРѕРєРё Р»РѕРіРѕРІ." >> "$GITHUB_STEP_SUMMARY"
          # Java/Kotlin: /path/File.java:12: error: С‚РµРєСЃС‚  в†’ РїРѕРјРµС‚РєР° СЃ С„Р°Р№Р»РѕРј Рё СЃС‚СЂРѕРєРѕР№
          grep -hE '\.(java|kt|xml|gradle):[0-9]+(:[0-9]+)?: (error|warning)?' logs/gradle.log 2>/dev/null | grep -i error | head -20 | \
            sed -E 's#^.*/(android/[^:]+):([0-9]+):? *(error:)? *(.*)$#::error file=\1,line=\2,title=РћС€РёР±РєР° СЃР±РѕСЂРєРё::\4#' || true
          # Р“Р»Р°РІРЅР°СЏ РїСЂРёС‡РёРЅР° РѕС‚ Gradle
          awk '/What went wrong:/{f=1} f{print} /Try:/{f=0}' logs/gradle.log | head -30 | while IFS= read -r l; do
            [ -n "$l" ] && echo "::error title=РџСЂРёС‡РёРЅР° (Gradle)::$l"
          done
          # РћС€РёР±РєРё npm
          grep -hE 'npm ERR!|ERR_|\[error\]' logs/npm.log logs/cap-*.log logs/icons.log 2>/dev/null | head -15 | while IFS= read -r l; do
            echo "::error title=РћС€РёР±РєР° С€Р°РіР°::$l"
          done
          {
            echo '### РљР»СЋС‡РµРІС‹Рµ СЃС‚СЂРѕРєРё Р»РѕРіРѕРІ'
            echo '```'
            grep -hnE 'error|FAILED|What went wrong|Exception|npm ERR!' logs/*.log 2>/dev/null | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Р›РѕРіРё РІСЃРµРіРґР° РїСЂРёРєСЂРµРїР»СЏСЋС‚СЃСЏ Рє Р·Р°РїСѓСЃРєСѓ (Artifacts в†’ build-logs)
      - name: РЎРѕС…СЂР°РЅРёС‚СЊ Р»РѕРіРё
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore

      - name: РЎРѕС…СЂР°РЅРёС‚СЊ APK
        uses: actions/upload-artifact@v4
        with:
          name: pvp-sapper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
