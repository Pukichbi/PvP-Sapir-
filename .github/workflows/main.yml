name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Найти папку проекта
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$P" ]; then
            echo "::error::package.json не найден в репозитории. Загрузите файлы проекта."
            ls -R
            exit 1
          fi
          echo "DIR=$(dirname "$P")" >> "$GITHUB_ENV"
          echo "Проект в папке: $(dirname "$P")"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: npm install
        run: cd "$DIR" && npm install

      - name: Создать Android-проект
        run: cd "$DIR" && npx cap add android

      - name: Иконки
        run: cd "$DIR" && npx capacitor-assets generate --android --iconBackgroundColor '#14121c' --iconBackgroundColorDark '#14121c'

      - name: Синхронизация
        run: cd "$DIR" && npx cap sync android

      - name: Сборка APK
        run: cd "$DIR/android" && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pvp-sapper-apk
          path: ${{ env.DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
